services:
  postgres:
    image: postgres:16
    container_name: bookshop_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: BookShopApi
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: bookshop_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '8081:80'
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: bookshop_redis
    ports:
      - '6379:6379'
    restart: unless-stopped

  maildev:
    image: maildev/maildev
    container_name: bookshop_maildev
    ports:
      - '1080:1080'
      - '1025:1025'
    restart: unless-stopped

volumes:
  postgres_data:
